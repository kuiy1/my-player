<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云音乐 · 黑胶播放器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #1c1e24 0%, #0e1013 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .player-card {
            width: 100%;
            max-width: 380px;
            background: rgba(24, 26, 32, 0.92);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 38px;
            padding: 28px 24px 34px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: transform 0.2s ease;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #9aa0a6;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
            padding: 0 6px;
        }

        .status-bar i {
            font-size: 14px;
            color: #b3b9c0;
        }

        .record-area {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
            position: relative;
        }

        .disc-wrapper {
            width: 200px;
            height: 200px;
            position: relative;
        }

        .vinyl-disc {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #2a2a2e, #0c0c0e 75%);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .vinyl-disc::before {
            content: '';
            position: absolute;
            width: 86%;
            height: 86%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.6);
        }

        .vinyl-disc::after {
            content: '';
            position: absolute;
            width: 68%;
            height: 68%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.7);
        }

        .album-cover {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #3b3f4a, #1e2128);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(255, 255, 255, 0.06);
            position: relative;
            z-index: 3;
            border: 1px solid #5a5e6b;
        }

        .album-cover::after {
            content: '';
            width: 12px;
            height: 12px;
            background: #0e1013;
            border-radius: 50%;
            box-shadow: inset 0 0 6px black, 0 0 0 2px rgba(255, 255, 255, 0.05);
        }

        .tonearm {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 52px;
            height: 100px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.9;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
        }

        .tonearm-base {
            position: absolute;
            top: 0;
            right: 0;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #4a4f5c, #24272e);
            border-radius: 50%;
            border: 1px solid #5e6370;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
        }

        .tonearm-stick {
            position: absolute;
            top: 18px;
            right: 12px;
            width: 6px;
            height: 70px;
            background: linear-gradient(90deg, #8b8f9c, #d0d4dd, #8b8f9c);
            border-radius: 6px;
            transform: rotate(18deg);
            transform-origin: top right;
            box-shadow: 0 2px 6px black;
        }

        .tonearm-head {
            position: absolute;
            bottom: 4px;
            left: -10px;
            width: 22px;
            height: 12px;
            background: linear-gradient(145deg, #2f333c, #16181e);
            border-radius: 20% 40% 40% 20% / 60% 60% 40% 40%;
            transform: rotate(18deg);
            border: 1px solid #555b67;
            box-shadow: -2px 4px 6px black;
        }

        .track-info {
            text-align: center;
            margin-bottom: 24px;
        }

        .track-title {
            color: #f0f3f8;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            color: #a7b0ba;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.2px;
            opacity: 0.9;
        }

        .progress-area {
            margin-bottom: 18px;
            padding: 0 4px;
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            color: #8c939e;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.4px;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        .progress-fill {
            width: 42%;
            height: 100%;
            background: linear-gradient(90deg, #d44d4d, #b33e3e);
            border-radius: 12px;
            position: relative;
            transition: width 0.1s linear;
            box-shadow: 0 0 12px rgba(212, 77, 77, 0.6);
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 0 0 3px rgba(212, 77, 77, 0.3);
            transition: opacity 0.2s;
        }

        .progress-bar-bg:hover .progress-fill::after {
            opacity: 1;
            transform: translateY(-50%) scale(1.2);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            padding: 0 6px;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: #d0d6e0;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        .control-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.06);
            transform: scale(1.05);
        }

        .control-btn.small {
            font-size: 18px;
            color: #a2aab6;
        }

        .control-btn.small:hover {
            color: #e0e5ec;
        }

        .play-btn {
            width: 68px;
            height: 68px;
            background: linear-gradient(145deg, #d44d4d, #b33e3e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 28px rgba(180, 50, 50, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        .play-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 16px 32px rgba(200, 60, 60, 0.7), 0 0 0 3px rgba(255, 255, 255, 0.15);
        }

        .play-btn:active {
            transform: scale(0.98);
        }

        .bottom-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9aa2af;
            font-size: 18px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            position: relative;
            box-shadow: inset 0 1px 3px black;
        }

        .volume-fill {
            width: 70%;
            height: 100%;
            background: #d0d6e0;
            border-radius: 6px;
            position: relative;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .volume-fill::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 1px 6px black;
        }

        .action-icons {
            display: flex;
            gap: 18px;
            color: #9aa2af;
            font-size: 18px;
        }

        .action-icons i {
            cursor: pointer;
            transition: color 0.2s;
        }

        .action-icons i:hover {
            color: #d44d4d;
        }

        .disc-spin {
            animation: spin 20s linear infinite;
            animation-play-state: paused;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="player-card">
        <div class="status-bar">
            <span><i class="fas fa-signal"></i> 5G</span>
            <span>10:28</span>
            <span><i class="fas fa-battery-three-quarters"></i> 92%</span>
        </div>

        <div class="record-area">
            <div class="disc-wrapper">
                <div class="tonearm">
                    <div class="tonearm-base"></div>
                    <div class="tonearm-stick"></div>
                    <div class="tonearm-head"></div>
                </div>
                <div class="vinyl-disc disc-spin">
                    <div class="album-cover"></div>
                </div>
            </div>
        </div>

        <div class="track-info">
            <div class="track-title">夜航星</div>
            <div class="track-artist">不才 · 三体广播剧</div>
        </div>

        <div class="progress-area">
            <div class="time-labels">
                <span>01:24</span>
                <span>03:22</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn small"><i class="fas fa-random"></i></button>
            <button class="control-btn"><i class="fas fa-step-backward"></i></button>
            <button class="play-btn"><i class="fas fa-play" style="margin-left: 4px;"></i></button>
            <button class="control-btn"><i class="fas fa-step-forward"></i></button>
            <button class="control-btn small"><i class="fas fa-redo-alt"></i></button>
        </div>

        <div class="bottom-actions">
            <div class="volume-control">
                <i class="fas fa-volume-up"></i>
                <div class="volume-slider">
                    <div class="volume-fill"></div>
                </div>
            </div>
            <div class="action-icons">
                <i class="far fa-heart"></i>
                <i class="far fa-comment-dots"></i>
                <i class="fas fa-ellipsis-h"></i>
            </div>
        </div>
    </div>
</body>
</html>
